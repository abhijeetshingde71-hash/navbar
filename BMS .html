<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./BMS navbar.css">
</head>
<body>
    <header>
        <!-- Top row -->
        <nav class="topBar">
            <div class="topInner">
                <div class="topLeft">
                    <a href="#" class="brand">book<span>my</span>show</a>
                    <div class="searchBox">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities">
                    </div>
                </div>

                <div class="topRight">
                    <a href="#" class="city">Pune <i class="fa-solid fa-chevron-down"></i></a>
                    <a href="#" class="signIn">Sign in</a>
                    <a href="#" class="hamburger"><i class="fa-solid fa-bars"></i></a>
                </div>
            </div>
        </nav>

        <!-- Second row -->
        <nav class="bottomBar">
            <div class="bottomInner">
                <ul class="leftLinks">
                    <li><a href="#">Movies</a></li>
                    <li><a href="#">Stream</a></li>
                    <li><a href="#">Events</a></li>
                    <li><a href="#">Plays</a></li>
                    <li><a href="#">Sports</a></li>
                    <li><a href="#">Activities</a></li>
                </ul>
                <ul class="rightLinks">
                    <li><a href="#">ListYourShow</a></li>
                    <li><a href="#">Corporates</a></li>
                    <li><a href="#">Offers</a></li>
                    <li><a href="#">Gift Cards</a></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>

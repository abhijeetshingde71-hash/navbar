<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./LKDN navbar.css">
</head>
<body>
    <nav class="linkedinNav">
        <div class="leftSide">
            <a href="#" class="logo"><i class="fa-brands fa-linkedin"></i></a>
            <div class="searchBox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search">
            </div>
        </div>

        <ul class="menu">
            <li class="menuItem active">
                <a href="#"><i class="fa-solid fa-house"></i><span>Home</span></a>
            </li>
            <li class="menuItem">
                <a href="#">
                    <i class="fa-solid fa-user-group"></i>
                    <span class="badge">6</span>
                    <span>My Network</span>
                </a>
            </li>
            <li class="menuItem">
                <a href="#"><i class="fa-solid fa-briefcase"></i><span>Jobs</span></a>
            </li>
            <li class="menuItem">
                <a href="#"><i class="fa-solid fa-comment-dots"></i><span>Messaging</span></a>
            </li>
            <li class="menuItem">
                <a href="#">
                    <i class="fa-solid fa-bell"></i>
                    <span class="badge">25</span>
                    <span>Notifications</span>
                </a>
            </li>
            <li class="menuItem">
                <a href="#">
                    <i class="fa-solid fa-circle-user profile"></i>
                    <span>Me <i class="fa-solid fa-caret-down small"></i></span>
                </a>
            </li>
        </ul>

        <div class="rightSide">
            <a href="#" class="business">
                <i class="fa-solid fa-table-cells"></i>
                <span>For Business <i class="fa-solid fa-caret-down small"></i></span>
            </a>
            <a href="#" class="premium">
                <i class="fa-solid fa-square premiumIcon"></i>
                <span>Try Premium for ₹0</span>
            </a>
        </div>
    </nav>
</body>
</html>
